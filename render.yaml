# Render Deployment Configuration for Next.js Unified Architecture
# https://render.com/docs/blueprint-spec

services:
  # Unified Next.js Web Service (Frontend + API Routes)
  - type: web
    name: darshan-portfolio
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install --prefix nextapp && npm --prefix nextapp run build
    startCommand: npm --prefix nextapp start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSKEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_EMAIL_PASS
        sync: false
